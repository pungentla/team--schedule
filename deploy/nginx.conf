# 排班宝 TeamShift —— Nginx 反向代理配置
#
# 部署到 /etc/nginx/conf.d/default.conf（compose 已挂载）
#
# 重要：小程序真机对 TLS 要求较严，必须
#   1. TLS 1.2+
#   2. 证书链完整（fullchain.pem，不能只给 cert.pem）
#   3. 不能有明显协议/加密套件问题

# HTTP -> HTTPS 跳转（同时保留 certbot 验证路径）
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # 证书路径（certbot 生成的目录结构）
    ssl_certificate     /etc/nginx/certs/live/teamshift/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/teamshift/privkey.pem;

    # 小程序真机必须 TLS 1.2+
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 上传体积限制（本项目只收 JSON，1MB 足够）
    client_max_body_size 2m;

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # 关键：传递真实客户端 IP，后端限流依赖这个
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 不缓冲流式响应（本项目响应都很小，关了更简单）
        proxy_buffering off;
    }

    # 健康检查直达，便于外部探活
    location = /health {
        proxy_pass http://backend:3000/api/health;
        access_log off;
    }

    # 其他路径一律 404（本服务只提供 API）
    location / {
        return 404;
    }
}
